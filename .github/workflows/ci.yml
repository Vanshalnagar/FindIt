name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # Tests use mongodb-memory-server, which downloads a MongoDB binary on first run.
      # No external MongoDB service is required.
      - run: npm test

  client-tests-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [server-tests, client-tests-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build images (no push)
        run: docker compose build
