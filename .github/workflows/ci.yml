name: FindIt CI/CD

on:
  push:
    branches: [main, develop, vanshal]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: findit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run server tests
        run: npm test

  client-tests-build:
    name: Client tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run client tests
        run: npm test
      - name: Build client bundle
        run: npm run build

  docker-build:
    name: Docker compose validation
    runs-on: ubuntu-latest
    needs: [server-tests, client-tests-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build images with Docker Compose
        run: docker compose build
      - name: Temporary failure demonstration
        run: exit 1

  publish-images:
    name: Publish Docker images
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase repository owner
        id: repo_owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/findit-server:${{ github.sha }}
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/findit-server:${{ github.ref_name == 'main' && 'latest' || 'develop' }}
      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/findit-client:${{ github.sha }}
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/findit-client:${{ github.ref_name == 'main' && 'latest' || 'develop' }}
